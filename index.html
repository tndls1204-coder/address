 <!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>배송지 입력</title>

  <!-- 다음(카카오) 주소검색 -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, sans-serif; background: #f6f7f9; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 18px; }
    .card { background: #fff; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.06); padding: 18px; }
    h1 { font-size: 18px; margin: 0 0 14px; }
    .muted { color: #666; font-size: 13px; line-height: 1.45; margin: 0 0 16px; }
    .row { display: grid; gap: 10px; margin: 12px 0; }
    label { font-size: 13px; color: #222; }
    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      border-radius: 12px;
      border: 1px solid #d8dde6;
      padding: 12px 12px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }
    input:focus, textarea:focus { border-color: #5b8cff; box-shadow: 0 0 0 3px rgba(91,140,255,.15); }
    .btn { border: 0; background: #2f6dff; color: #fff; font-weight: 700; cursor: pointer; padding: 13px 14px; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-ghost { background: #eef3ff; color: #1f4fcc; border: 1px solid #d6e2ff; font-weight: 700; cursor: pointer; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toast {
      margin-top: 12px;
      padding: 12px 12px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }
    .toast.ok { display:block; background:#ecfff1; border:1px solid #bdeccc; color:#146b2f; }
    .toast.err { display:block; background:#fff1f1; border:1px solid #f0b9b9; color:#8a1f1f; }
    .small { font-size: 12px; color:#777; margin-top: 10px; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>배송지 입력</h1>
      <p class="muted">
        아래에서 주소를 검색한 뒤 <b>상세주소</b>까지 입력하고 제출해 주세요.
      </p>

      <div class="row">
        <label>주소</label>
        <div class="grid2">
          <input id="postcode" type="text" placeholder="우편번호" readonly />
          <button class="btn-ghost" type="button" onclick="openPostcode()">주소 검색</button>
        </div>
        <input id="roadAddress" type="text" placeholder="기본주소(도로명/지번)" readonly />
        <input id="detailAddress" type="text" placeholder="상세주소 (예: 101동 1004호)" />
      </div>

      <div class="row">
        <button id="submitBtn" class="btn" type="button" onclick="submitAddress()">제출</button>
        <div id="toast" class="toast"></div>
        <div class="small">제출 후 1~5초 내로 구글 응답시트에 반영됩니다.</div>
      </div>

      <!-- ✅ CORS 회피: fetch 대신 form POST + hidden iframe -->
      <form id="postForm" method="POST" target="hiddenFrame" style="display:none;">
        <input type="hidden" name="address" id="hiddenAddress" />
      </form>
      <iframe name="hiddenFrame" style="display:none;"></iframe>
    </div>
  </div>

  <script>
    // ✅ 여기에 너의 Apps Script 웹앱 exec URL을 넣어줘
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVas_iyXnQQymnwBBn31QEWfUHdwC5Ln6wTyDZekdCam41gXaKsux8LL3WGQiAJIJG/exec";

    function setToast(type, msg) {
      const el = document.getElementById("toast");
      if (!type) { el.className = "toast"; el.textContent = ""; return; }
      el.className = "toast " + (type === "ok" ? "ok" : "err");
      el.textContent = msg;
    }

    function openPostcode() {
      new daum.Postcode({
        oncomplete: function(data) {
          const postcode = data.zonecode || "";
          const addr = data.roadAddress || data.jibunAddress || "";

          document.getElementById("postcode").value = postcode;
          document.getElementById("roadAddress").value = addr;
          document.getElementById("detailAddress").focus();
        }
      }).open();
    }

    function submitAddress() {
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      setToast("", "");

      const postcode = (document.getElementById("postcode").value || "").trim();
      const baseAddr = (document.getElementById("roadAddress").value || "").trim();
      const detail = (document.getElementById("detailAddress").value || "").trim();

      if (!baseAddr) { setToast("err", "주소 검색을 먼저 해주세요."); btn.disabled = false; return; }
      if (!detail) { setToast("err", "상세주소를 입력해 주세요."); btn.disabled = false; return; }

      const fullAddress = `${postcode ? "(" + postcode + ") " : ""}${baseAddr} ${detail}`.trim();

      // ✅ form POST로 전송(=CORS 없음)
      const form = document.getElementById("postForm");
      form.action = SCRIPT_URL;
      document.getElementById("hiddenAddress").value = fullAddress;

      try {
        form.submit();
        setToast("ok", "제출 완료! 감사합니다. (시트 반영까지 잠시만 기다려 주세요)");
      } catch (e) {
        setToast("err", "제출 중 오류가 발생했습니다: " + (e?.message || String(e)));
      } finally {
        // UX상 바로 다시 누를 수 있게
        setTimeout(() => { btn.disabled = false; }, 800);
      }
    }
  </script>
</body>
</html>
