<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>배려프레스코프루타 주문/배송지 입력</title>

  <!-- 다음(카카오) 주소검색 -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, sans-serif;
      background: #f6f7f9;
      color: #111;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 18px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,.06);
      padding: 18px;
      margin-bottom: 14px;
    }

    h1 { font-size: 18px; margin: 0 0 6px; }
    .sub { margin: 0 0 14px; color: #555; font-size: 13px; line-height: 1.5; }

    .badge {
      display:inline-block;
      font-size:12px;
      padding:3px 8px;
      border-radius:999px;
      background:#eef3ff;
      color:#1f4fcc;
      border:1px solid #d6e2ff;
      margin-bottom: 6px;
    }

    .row { margin: 12px 0; }

    label {
      display:block;
      font-size: 13px;
      color: #222;
      margin-bottom: 6px;
    }

    input, textarea, button {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #d8dde6;
      padding: 12px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus, textarea:focus {
      border-color: #5b8cff;
      box-shadow: 0 0 0 3px rgba(91,140,255,.15);
    }

    .grid2 {
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid3 {
      display:grid;
      grid-template-columns: 140px 1fr;
      gap: 10px;
    }

    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
      line-height: 1.45;
    }

    .btn {
      border: 0;
      background: #2f6dff;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      padding: 13px 14px;
      border-radius: 12px;
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: #eef3ff;
      color: #1f4fcc;
      border: 1px solid #d6e2ff;
      font-weight: 800;
      cursor: pointer;
      border-radius: 12px;
    }

    .toast {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
      white-space: pre-line;
    }

    .toast.ok  {
      display:block;
      background:#ecfff1;
      border:1px solid #bdeccc;
      color:#146b2f;
    }

    .toast.err {
      display:block;
      background:#fff1f1;
      border:1px solid #f0b9b9;
      color:#8a1f1f;
    }

    /* =========================
       상품 리스트 (최종 고정 레이아웃)
       ========================= */

    .prod {
      border: 1px solid #eef0f5;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      background: #fcfcfd;
      overflow: hidden;
    }

    .prod-top {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 110px;
      gap: 12px;
      align-items: start;
    }

    .chk {
      width: 20px;
      height: 20px;
      margin-top: 2px;
    }

    .prod-main {
      min-width: 0;
    }

    .prod-name {
      display: block;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .prod-hint {
      margin-top: 6px;
      font-size: 12px;
      color: #666;
    }

    .qty {
      width: 110px;
      text-align: center;
    }

    .qty[disabled] {
      background:#f3f4f6;
      color:#999;
    }

    @media (max-width: 480px) {
      .prod-top {
        grid-template-columns: 28px minmax(0, 1fr) 92px;
        gap: 10px;
      }
      .qty { width: 92px; }
    }

    .small {
      font-size: 12px;
      color:#777;
      margin-top: 10px;
    }

    .hr {
      height:1px;
      background:#eef0f5;
      margin: 14px 0;
      border:0;
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="card">
    <div class="badge">배려프레스코프루타</div>
    <h1>주문 / 배송정보 입력</h1>
    <p class="sub">(주소는 ‘주소 검색’으로 선택 후 상세주소까지 꼭 입력해 주세요.)</p>
  </div>

  <div class="card">
    <h1>1) 주문자 / 수령인 정보</h1>

    <div class="row grid2">
      <div>
        <label>주문자 성함</label>
        <input id="ordererName" placeholder="예: 홍길동">
      </div>
      <div>
        <label>수령인 성함</label>
        <input id="receiverName" placeholder="예: 이순신">
      </div>
    </div>

    <div class="row">
      <label>수령인 연락처</label>
      <input id="receiverPhone" placeholder="010-1234-5678">
      <div class="hint">숫자만 입력해도 자동으로 형식이 맞춰집니다.</div>
    </div>

    <hr class="hr">

    <h1>2) 배송지</h1>

    <div class="row">
      <label>주소</label>
      <div class="grid3">
        <button class="btn-ghost" type="button" onclick="openPostcode()">주소 검색</button>
        <input id="postcode" placeholder="우편번호" readonly>
      </div>
      <input id="baseAddress" placeholder="주소 검색을 눌러 선택" readonly style="margin-top:10px;">
      <input id="detailAddress" placeholder="상세주소 (예: 101동 1004호)" style="margin-top:10px;">
      <div class="hint">상세주소 미입력 시 반송/오배송 위험이 있습니다.</div>
    </div>

    <div class="row">
      <label>배송 메시지 (선택)</label>
      <input id="message" placeholder="예: 문 앞에 놓아주세요.">
    </div>
  </div>

  <div class="card">
    <h1>3) 주문 상품 & 수량</h1>
    <p class="sub">원하는 상품을 체크하고 수량을 입력해 주세요.</p>
    <div id="productList"></div>
    <div class="small">※ 대량 구매 문의: 010-4982-5550 / sales@brfta.com</div>
  </div>

  <div class="card">
    <button id="submitBtn" class="btn" onclick="submitAll()">주문하기</button>
    <div id="toast" class="toast"></div>
    <div class="small">
      주문 완료 메시지가 나올 때까지 잠시 기다려 주세요.<br>
      ※ 주문/구매 확인 문의: 010-4982-5550
    </div>
  </div>

</div>

<script>
  /* JS 로직은 네가 지금 쓰는 버전 그대로 붙이면 됨
     (SCRIPT_URL / renderProducts / submitAll 등) */
</script>

</body>
</html>
