<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>배려프레스코푸르타 주문/배송지 입력</title>

  <!-- 다음(카카오) 주소검색 -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, sans-serif;
      background: #f6f7f9;
      color: #111;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 18px; }
    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,.06);
      padding: 18px;
      margin-bottom: 14px;
    }
    h1 { font-size: 18px; margin: 0 0 6px; }
    .sub { margin: 0 0 14px; color: #555; font-size: 13px; line-height: 1.5; }
    .badge { display:inline-block; font-size:12px; padding:3px 8px; border-radius:999px; background:#eef3ff; color:#1f4fcc; border:1px solid #d6e2ff; }

    .row { margin: 12px 0; }
    label { display:block; font-size: 13px; color: #222; margin-bottom: 6px; }
    input, textarea, select, button {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #d8dde6;
      padding: 12px 12px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }
    textarea { min-height: 84px; resize: vertical; }
    input:focus, textarea:focus, select:focus {
      border-color: #5b8cff;
      box-shadow: 0 0 0 3px rgba(91,140,255,.15);
    }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .hint {
      font-size: 12px;
      color: #666;
      line-height: 1.45;
      margin-top: 6px;
    }
    .example {
      font-size: 12px;
      color: #555;
      background: #fafbff;
      border: 1px dashed #d6e2ff;
      border-radius: 12px;
      padding: 10px;
      margin-top: 8px;
    }

    .btn {
      border: 0;
      background: #2f6dff;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      padding: 13px 14px;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-ghost {
      background: #eef3ff;
      color: #1f4fcc;
      border: 1px solid #d6e2ff;
      font-weight: 800;
      cursor: pointer;
    }

    .toast {
      margin-top: 12px;
      padding: 12px 12px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
      white-space: pre-line;
    }
    .toast.ok  { display:block; background:#ecfff1; border:1px solid #bdeccc; color:#146b2f; }
    .toast.err { display:block; background:#fff1f1; border:1px solid #f0b9b9; color:#8a1f1f; }

    .prod {
      border: 1px solid #eef0f5;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      background: #fcfcfd;
    }
    .prod-top {
      display:flex;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .prod-title { font-size: 14px; font-weight: 700; margin: 0; }
    .prod-right { display:flex; gap:10px; align-items:center; min-width: 200px; }
    .qty {
      width: 110px;
      text-align: center;
    }
    .qty[disabled] { background:#f3f4f6; color:#999; }
    .chk { transform: translateY(2px); }
    .small { font-size: 12px; color:#777; margin-top: 10px; }
    .hr { height:1px; background:#eef0f5; margin: 14px 0; border:0; }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="card">
      <div class="badge"> 배려프레스코프루타 </div>
      <h1> 주문 / 배송정보 입력</h1>
      <p class="sub">
        <span style="color:#777;">(주소는 ‘주소 검색’으로 선택 후 상세주소까지 꼭 입력해 주세요.)</span>
      </p>
    </div>

    <div class="card">
      <h1>1) 주문자 / 수령인 정보</h1>

      <div class="row grid2">
        <div>
          <label>주문자 성함</label>
          <input id="ordererName" type="text" placeholder="예: 홍길동" autocomplete="name" />
        </div>
        <div>
          <label>수령인 성함 (배송 받는 분)</label>
          <input id="receiverName" type="text" placeholder="예: 이순신" autocomplete="name" />
        </div>
      </div>

      <div class="row">
        <label>수령인 연락처</label>
        <input id="receiverPhone" type="tel" inputmode="numeric" placeholder="예: 010-1234-5678" autocomplete="tel" />
        <div class="hint">숫자만 입력해도 자동으로 010-1234-5678 형태로 정리됩니다.</div>
      </div>

      <hr class="hr"/>

      <h1>2) 배송지</h1>

      <div class="row">
        <label>주소</label>

        <!-- ✅ 우편번호 추가 (로젠/주문서에 유용) -->
        <div class="grid3">
         <button class="btn-ghost" type="button" onclick="openPostcode()">주소 검색</button>
          <input id="postcode" type="text" placeholder="우편번호" readonly /></div>
          <input id="baseAddress" type="text" placeholder="주소 검색을 눌러 선택" readonly />
        </div>

        <div style="margin-top:10px;">
          <input id="detailAddress" type="text" placeholder="상세주소 (예: 101동 1004호)" />
          <div class="hint">상세주소 미입력 시 반송/오배송 위험이 있습니다.</div>
        </div>
      </div>

      <div class="row">
        <label>배송 메세지 (선택)</label>
        <input id="message" type="text" placeholder="예: 문 앞에 놓아주세요."/>
      </div>
    </div>

    <div class="card">
      <h1>3) 주문 상품 & 수량</h1>
      <p class="sub">원하는 상품을 체크하고, 각 상품의 <b>수량</b>을 입력해 주세요.</p>

      <div id="productList"></div>

      <div class="small">
        ※ 대량 구매 별도 문의 <b>(010-4982-5550)</b> <br/>
      </div>
    </div>

    <div class="card">
      <h1>제출</h1>
      <button id="submitBtn" class="btn" type="button" onclick="submitAll()">제출하기</button>
      <div id="toast" class="toast"></div>
      <div class="small">제출 후 1~3초 내로 주문 내용과 배송 정보가 전달됩니다. 감사합니다.</div>
    </div>

  </div>

  <!-- ✅ JS는 반드시 script 태그 안에 -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbws3LtV9zd3Gd7m7OyzteuYZBxUy1oRRZbkSq74VxV4TA8wKh3S_P2uIpq3Z_on6tYAnQ/exec";
    const PRODUCTS = [
      "생과 배 특7.5kg (8~10과)",
      "생과 배 특15kg (16~20과)",
      "전통건강즙(배즙) 10포 (1박스)",
      "전통건강즙(배즙) 10포 (3박스)",
      "전통건강즙(배즙) 30포 (1박스)",
      "전통건강즙(배즙) 30포 (2박스)",
      "도라지배즙 10포 (1박스)",
      "도라지배즙 10포 (3박스)",
      "도라지배즙 30포 (1박스)",
      "도라지배즙 30포 (2박스)",
      "배즙30+도라지배즙30 (2박스)"
    ];

    function setToast(type, msg) {
      const el = document.getElementById("toast");
      if (!type) {
        el.className = "toast";
        el.textContent = "";
        el.style.display = "none";
        return;
      }
      el.className = "toast " + (type === "ok" ? "ok" : "err");
      el.textContent = msg;
      el.style.display = "block";
    }

    function digitsOnly(value) {
      return (value || "").replace(/[^\d]/g, "");
    }

    function normalizePhone(value) {
      const digits = digitsOnly(value);
      // 010 11자리
      if (digits.length === 11 && digits.startsWith("010")) {
        return `${digits.slice(0,3)}-${digits.slice(3,7)}-${digits.slice(7)}`;
      }
      // 010 10자리(구형) 케이스도 유지
      if (digits.length === 10 && digits.startsWith("010")) {
        return `${digits.slice(0,3)}-${digits.slice(3,6)}-${digits.slice(6)}`;
      }
      return (value || "").trim();
    }

    function openPostcode() {
      new daum.Postcode({
        oncomplete: function(data) {
          const addr = data.roadAddress || data.jibunAddress || "";
          const zonecode = data.zonecode || "";
          document.getElementById("postcode").value = zonecode;
          document.getElementById("baseAddress").value = addr;
          document.getElementById("detailAddress").focus();
        }
      }).open();
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderProducts() {
      const root = document.getElementById("productList");
      root.innerHTML = "";
      PRODUCTS.forEach((name, idx) => {
        const id = `p_${idx}`;
        const qid = `q_${idx}`;
        const div = document.createElement("div");
        div.className = "prod";
        div.innerHTML = `
          <div class="prod-top">
            <div style="flex:1;">
              <p class="
