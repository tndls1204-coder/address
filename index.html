<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>주소 입력</title>

  <!-- 다음(카카오) 우편번호 서비스 -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
    h1 { margin: 0 0 16px; }
    label { display:block; margin: 14px 0 6px; font-weight: 700; }
    input { width: 100%; max-width: 520px; padding: 12px; font-size: 16px; box-sizing: border-box; }
    .row { display:flex; gap: 10px; max-width: 520px; }
    .row input { flex: 1; }
    button { padding: 12px 14px; font-size: 16px; cursor:pointer; }
    .hint { margin-top: 10px; color:#666; font-size: 13px; }
    .box { max-width: 520px; }
  </style>
</head>

<body>
  <div class="box">
    <h1>주소 입력</h1>

    <label for="name">이름 *</label>
    <input id="name" placeholder="예: 김수린" />

    <label>주소 *</label>
    <div class="row">
      <input id="zonecode" placeholder="우편번호" readonly />
      <button type="button" id="btnSearch">주소검색</button>
    </div>

    <input id="address" placeholder="기본주소" readonly style="margin-top:10px;" />
    <input id="detail" placeholder="상세주소 (예: 101동 1203호)" style="margin-top:10px;" />

    <button type="button" id="btnSubmit" style="margin-top:16px; width:100%; max-width:520px;">
      제출(구글폼으로 이동)
    </button>

    <div class="hint">
      버튼을 누르면 구글폼이 “미리 채워진 상태”로 열립니다. 그 화면에서 <b>최종 제출</b>만 눌러주세요.
    </div>
  </div>

  <script>
    // ✅ 너의 구글폼(viewform) URL
    const FORM_VIEW_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdH3XgtcxCssGlHj0GkazWS9Wa5dkEBzGLTyTHCUd5OWkadrw/viewform";

    // ✅ entry 번호 (너가 확인한 값)
    const ENTRY_NAME = "entry.982136303";
    const ENTRY_ADDR = "entry.480120806";

    // 다음 주소검색
    document.getElementById("btnSearch").addEventListener("click", () => {
      new daum.Postcode({
        oncomplete: function(data) {
          document.getElementById("zonecode").value = data.zonecode || "";
          document.getElementById("address").value = data.roadAddress || data.jibunAddress || "";
          document.getElementById("detail").focus();
        }
      }).open();
    });

    // 구글폼 미리채움 링크로 이동
    document.getElementById("btnSubmit").addEventListener("click", () => {
      const name = (document.getElementById("name").value || "").trim();
      const addr1 = (document.getElementById("address").value || "").trim();
      const addr2 = (document.getElementById("detail").value || "").trim();
      const zone = (document.getElementById("zonecode").value || "").trim();

      if (!name) { alert("이름을 입력해 주세요."); return; }
      if (!addr1) { alert("주소검색으로 기본주소를 선택해 주세요."); return; }

      // 주소 한 칸에 합쳐서 넣기 (우편번호+기본주소+상세주소)
      const fullAddress = `[${zone}] ${addr1}${addr2 ? " " + addr2 : ""}`;

      // ✅ 구글폼 “미리채움” 쿼리: usp=pp_url + entry.xxx=값
      const url =
        `${FORM_VIEW_URL}?usp=pp_url` +
        `&${ENTRY_NAME}=${encodeURIComponent(name)}` +
        `&${ENTRY_ADDR}=${encodeURIComponent(fullAddress)}`;

      // 이동
      window.location.href = url;
    });

    // (선택) 카톡으로 전달할 때 URL 파라미터로 이름을 미리 넣고 싶으면:
    // ?name=김수린 형태로 받도록
    (function prefillFromQuery(){
      const p = new URLSearchParams(location.search);
      const qName = p.get("name");
      if (qName) document.getElementById("name").value = qName;
    })();
  </script>
</body>
</html>
