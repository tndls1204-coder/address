<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>주소 입력 테스트</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
    .card { max-width: 520px; padding: 16px; border: 1px solid #ddd; border-radius: 12px; }
    label { display:block; margin: 12px 0 6px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; }
    button { margin-top: 14px; width: 100%; padding: 12px; border: 0; border-radius: 10px; font-size: 16px; }
    .ok { background: #111; color: #fff; }
    .muted { margin-top: 10px; color:#666; font-size: 13px; line-height: 1.4; }
  </style>
</head>

<body>
  <div class="card">
    <h2 style="margin:0 0 10px;">구글폼 전송 테스트</h2>

    <label for="name">이름</label>
    <input id="name" type="text" placeholder="예) 수린" autocomplete="name" />

    <button class="ok" type="button" onclick="submitToGoogleForm()">제출</button>

    <div class="muted">
      * 제출 후 화면은 그대로여도 정상일 수 있어요(구글폼 응답 페이지를 숨김 처리).<br/>
      * iPhone/Safari면 “새로고침 후 시트 확인”이 더 확실합니다.
    </div>
  </div>

  <!-- 응답 페이지 로드를 숨기기 위한 iframe (구글이 X-Frame 막아도 제출 자체는 됩니다) -->
  <iframe name="hidden_iframe" style="display:none;"></iframe>

  <!-- 실제로 구글폼에 POST 되는 form -->
  <form id="googleForm" method="POST" target="hidden_iframe" style="display:none;">
    <!-- ✅ 이 entry 값은 "이름" 질문의 entry 번호여야 합니다 -->
    <input id="entry_name" name="entry.1974314202" />
  </form>

  <script>
    // ✅ 절대 줄바꿈 없이 "한 줄"로 유지하세요.
    const GOOGLE_FORM_ACTION =
      "https://docs.google.com/forms/d/e/1FAIpQLSdlW-FnNsajQyguq2IF4RzkL3XRpJ2bbknujs5Ai03Hgmysvw/formResponse";

    function submitToGoogleForm() {
      const name = document.getElementById("name").value.trim();
      if (!name) {
        alert("이름을 입력해 주세요.");
        return;
      }

      // 폼 액션 지정
      const form = document.getElementById("googleForm");
      form.action = GOOGLE_FORM_ACTION;

      // 값 주입
      document.getElementById("entry_name").value = name;

      // 제출
      try {
        form.submit();
        alert("제출했습니다! (시트 반영까지 몇 초 걸릴 수 있어요)");
        document.getElementById("name").value = "";
      } catch (e) {
        console.error(e);
        alert("제출 중 오류가 발생했습니다. 콘솔을 확인해 주세요.");
      }
    }
  </script>
</body>
</html>
