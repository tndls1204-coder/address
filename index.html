<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>주소 입력</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    input, button { font-size: 16px; padding: 8px; }
    button { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>주소 입력</h1>

  <label>
    이름 *
    <br />
    <input id="name" placeholder="예: 김수린" required />
  </label>

  <br />
  <button onclick="submitForm()">제출</button>

  <p id="result"></p>

<script>
const FORM_ID = "1FAIpQLSdlW-FnNsajQyguq2IF4RzkL3XRpJ2bbknujs5Ai03Hgmysvw";
const ENTRY_NAME = "entry.1974314202"; // 이름 질문 entry ID

async function submitForm() {
  const name = document.getElementById("name").value.trim();
  if (!name) {
    alert("이름을 입력하세요");
    return;
  }

  document.getElementById("result").innerText = "전송 중…";

  // 1️⃣ viewform을 먼저 로드해서 fbzx 추출
  const viewRes = await fetch(
    `https://docs.google.com/forms/d/e/${FORM_ID}/viewform`,
    { credentials: "omit" }
  );
  const html = await viewRes.text();

  const fbzxMatch = html.match(/name="fbzx" value="([^"]+)"/);
  if (!fbzxMatch) {
    document.getElementById("result").innerText = "fbzx 추출 실패";
    return;
  }

  const fbzx = fbzxMatch[1];

  // 2️⃣ 실제 제출
  const formData = new URLSearchParams();
  formData.append(ENTRY_NAME, name);
  formData.append("fvv", "1");
  formData.append("pageHistory", "0");
  formData.append("fbzx", fbzx);

  await fetch(
    `https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`,
    {
      method: "POST",
      mode: "no-cors",
      body: formData
    }
  );

  document.getElementById("result").innerText =
    "전송 요청을 보냈습니다. (시트 반영까지 몇 초 걸릴 수 있어요)";
}
</script>
</body>
</html>
