<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>주소 입력</title>

  <!-- 다음(카카오) 우편번호 -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
    h1 { margin: 0 0 16px; font-size: 36px; }
    label { display:block; margin: 14px 0 6px; font-weight: 700; }
    input { width: 100%; max-width: 420px; padding: 12px; font-size: 16px; box-sizing: border-box; }
    .row { display:flex; gap:10px; max-width: 420px; }
    .row input { flex:1; }
    button { padding: 14px 18px; font-size: 18px; cursor: pointer; }
    .muted { color:#666; margin-top:10px; }
    .ok { margin-top: 14px; padding: 12px; background:#e9f7ef; border:1px solid #bfe7cf; display:none; }
    .err { margin-top: 14px; padding: 12px; background:#fdecec; border:1px solid #f5bcbc; display:none; }
  </style>
</head>

<body>
  <h1>주소 입력</h1>

  <!-- 사용자 입력 UI -->
  <label>이름 *</label>
  <input id="name" placeholder="예: 김수린" required />

  <label>주소</label>
  <div class="row">
    <input id="postcode" placeholder="우편번호" readonly />
    <button type="button" id="btnPostcode">주소검색</button>
  </div>
  <input id="addr1" placeholder="기본주소" readonly style="margin-top:10px;" />
  <label>상세주소</label>
  <input id="addr2" placeholder="상세주소 (예: 444)" />

  <div style="margin-top:18px;">
    <button type="button" id="btnSubmit">제출</button>
  </div>

  <div class="muted">* 제출 시 구글폼(응답 시트)에 자동 기록됩니다.</div>
  <div id="okBox" class="ok">접수 완료! (시트 반영까지 몇 초 걸릴 수 있어요)</div>
  <div id="errBox" class="err"></div>

  <!-- ✅ CORS 회피 핵심: fetch 대신 "form POST" -->
  <iframe name="hidden_iframe" style="display:none;"></iframe>

  <form id="gform"
    action="https://docs.google.com/forms/d/e/1FAIpQLSdH3XgtcxCssGlHj0GkazWS9Wa5dkEBzGLTyTHCUd5OWkadrw/formResponse"
    method="POST"
    target="hidden_iframe"
    style="display:none;"
  >
    <!-- 너가 확인한 entry 값 -->
    <input name="entry.982136303" id="entryName" />
    <input name="entry.480120806" id="entryAddress" />

    <!-- 없어도 되는 경우가 많지만 넣어둠 -->
    <input name="fvv" value="1" />
    <input name="pageHistory" value="0" />
  </form>

  <script>
    const $ = (id) => document.getElementById(id);

    $("btnPostcode").addEventListener("click", () => {
      new daum.Postcode({
        oncomplete: function(data) {
          $("postcode").value = data.zonecode || "";
          $("addr1").value = data.roadAddress || data.jibunAddress || "";
          $("addr2").focus();
        }
      }).open();
    });

    $("btnSubmit").addEventListener("click", () => {
      $("okBox").style.display = "none";
      $("errBox").style.display = "none";

      const name = $("name").value.trim();
      if (!name) {
        $("errBox").textContent = "이름은 필수입니다.";
        $("errBox").style.display = "block";
        return;
      }

      const postcode = $("postcode").value.trim();
      const addr1 = $("addr1").value.trim();
      const addr2 = $("addr2").value.trim();

      // 주소는 네가 원하는 형식대로 합치면 됨
      const fullAddress = [postcode, addr1, addr2].filter(Boolean).join(" ");

      $("entryName").value = name;
      $("entryAddress").value = fullAddress;

      // 구글폼으로 제출(브라우저가 cross-origin form POST는 대부분 허용)
      $("gform").submit();

      // UI 표시(구글폼이 실제 성공 응답을 same-origin으로 못 돌려주므로, 일단 안내만)
      $("okBox").style.display = "block";
    });
  </script>
</body>
</html>
