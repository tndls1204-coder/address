<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>주소 입력</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; }
    .wrap { max-width: 420px; margin: 0 auto; }
    input { width: 100%; padding: 12px; font-size: 16px; margin: 10px 0; }
    button { width: 100%; padding: 12px; font-size: 16px; cursor: pointer; }
    #msg { margin-top: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>주소 입력 테스트</h2>

    <label for="name">이름</label>
    <input id="name" type="text" placeholder="이름을 입력하세요" />

    <button type="button" onclick="submitForm()">제출</button>

    <div id="msg"></div>
  </div>

  <script>
    // ✅ 새 배포 URL로 교체 완료
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycby1Roo6NAMDxWEFSUshwjdQEC5tg2e9BJaxXcv6Azz-btbPQx6vglD2dE_i3E-ZGaHL/exec";

    function setMsg(text) {
      document.getElementById("msg").textContent = text;
    }

    async function submitForm() {
      const name = document.getElementById("name").value.trim();
      if (!name) { alert("이름을 입력하세요"); return; }

      // ✅ 프리플라이트(OPTIONS) 발생 안 하는 전송 방식
      const body = new URLSearchParams();
      body.append("name", name);

      try {
        setMsg("전송 중...");

        const res = await fetch(WEBAPP_URL, {
          method: "POST",
          body: body,
          // ❌ headers 절대 추가하지 말 것
          // ❌ JSON.stringify 절대 금지
        });

        const out = await res.json().catch(() => ({}));

        if (res.ok && out.ok) {
          setMsg("✅ 전송 완료!\nstatus=" + (out.status ?? res.status));
          document.getElementById("name").value = "";
        } else {
          setMsg("❌ 실패\nHTTP=" + res.status + "\n" + JSON.stringify(out));
          alert("실패: " + (out.error || out.status || res.status));
        }
      } catch (err) {
        setMsg("❌ 네트워크 오류: " + err);
        alert("네트워크 오류: " + err);
      }
    }
  </script>
</body>
</html>
